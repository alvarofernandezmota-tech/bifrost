# Reglas de lint de bifrost, las mismas que midgaror (ver su ruff.toml).
# Sin este fichero cada maquina aplica su configuracion global y el mismo
# codigo da un numero distinto de avisos segun donde se corra.
target-version = "py312"
line-length = 100
# El entorno virtual vive dentro del repo y no es codigo nuestro.
exclude = ["venv"]

[lint]
# E4/E7/E9/F son las reglas por defecto de ruff. EXE se anade porque bot.py
# llevaba shebang sin permiso de ejecucion.
select = ["E4", "E7", "E9", "F", "EXE"]
